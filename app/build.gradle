plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.rumiologia'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.rumiologia"
        minSdk 26
        targetSdk 37
        versionCode 3
        versionName "1.2-logo"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // El interprete de TFLite mapea el modelo en memoria: si Gradle lo comprime
    // dentro del APK, no se puede abrir y falla en tiempo de ejecucion.
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.core.splashscreen

    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    implementation libs.tensorflow.lite
    implementation libs.tensorflow.lite.gpu

    implementation libs.retrofit
    implementation libs.retrofit.gson

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
